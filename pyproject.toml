[project]
name = "swatt-api"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Clifford William", email = "ccliffordwilliam@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.19.1",
    "psycopg[binary]>=3.3.5",
    "sqlalchemy>=2.0.52",
]

[project.scripts]
swatt-api = "swatt_api:main"

[build-system]
requires = ["uv_build>=0.12.7,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
]

[tool.ruff]
extend-exclude = ["alembic/versions"]
